# Accepted-risk register read by the SCA gate (spendwise-ci java-service.yml).
# Every entry needs a reason and an expiry; an expired entry fails the gate again.

vulnerabilities:
  # spring-webmvc / spring-webflux 6.2.x: fixed only in Spring Framework 7.0.9 (Spring Boot 4).
  - id: CVE-2026-47890
    statement: >-
      Server-Sent Events with view rendering. Not reachable: the gateway is Spring Cloud Gateway on WebFlux; it proxies routes and exposes no SSE endpoints or rendered views of its own.
      Removed by the Spring Boot 4 migration.
    expired_at: 2027-02-28

  # spring-webflux 6.2.x: fixed only in Spring Framework 7.0.9 (Spring Boot 4).
  - id: CVE-2026-47892
    statement: >-
      Header predicate bypass in WebFlux functional endpoints. Not reachable: routing uses Spring Cloud Gateway route predicates and annotated @RestController endpoints; no WebFlux.fn RouterFunction or RequestPredicates.
      Removed by the Spring Boot 4 migration.
    expired_at: 2027-02-28
